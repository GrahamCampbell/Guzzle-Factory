name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        guzzle: ['^8.0']
        include:
          - php: '7.4'
            guzzle: '^7.11'
          - php: '8.5'
            guzzle: '^7.11'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
        env:
          update: true

      - name: Setup Problem Matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install PHP Dependencies
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --with="guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --no-progress

      - name: Execute PHPUnit
        run: vendor/bin/phpunit
